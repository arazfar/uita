services:
  db:
    # imresamu/postgis is the multi-arch (amd64 + Apple Silicon) build of postgis/postgis
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flights
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${DATA_DIR:-../../sfomuseum-data-flights-2026-08/data}:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flights"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
