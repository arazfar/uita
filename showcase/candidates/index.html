<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UITA candidates</title>
    <style>
      :root {
        --ink: #e6edf0;
        --muted: #8aa0a8;
        --line: #24323a;
        --bg: #0e1519;
        --card: #142027;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.45 Inter, ui-sans-serif, system-ui, sans-serif;
      }
      header {
        padding: 28px 32px 8px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
      }
      header p {
        color: var(--muted);
        margin: 6px 0 0;
      }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
        gap: 16px;
        padding: 20px 32px 40px;
      }
      a.card {
        display: block;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        color: inherit;
        text-decoration: none;
      }
      a.card:hover {
        border-color: #4aa3c7;
      }
      .frame {
        position: relative;
        aspect-ratio: 16/10;
        overflow: hidden;
        background: #0a1013;
      }
      .frame img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .pending {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 12px;
      }
      .frame iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 1440px;
        height: 900px;
        border: 0;
        transform-origin: 0 0;
        pointer-events: none;
      }
      .meta {
        padding: 12px 14px;
      }
      .meta b {
        font-size: 14px;
      }
      .meta span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-top: 3px;
      }
      .tag {
        float: right;
        font-size: 10px;
        letter-spacing: 0.5px;
        color: #9fd3e6;
        border: 1px solid #2c4b57;
        border-radius: 4px;
        padding: 1px 6px;
      }
      @media (max-width: 480px) {
        header,
        main {
          padding-left: 16px;
          padding-right: 16px;
        }
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>UITA · visualization candidates</h1>
      <p><a href="app.html" style="color:#7fd0ec">▶ Open the shipped app: dashboard ⇄ tower cab</a></p>
      <p>
        Same scenario everywhere: surprise storm closes C–E, agents propose, the
        kernel commits, one readback mismatch is caught. Click to open full
        screen. Live previews load lazily.
      </p>
    </header>
    <main id="grid"></main>
    <script>
      const items = [
        ["01-tower-cab", "Tower cab", "Tower! Sim-style 3D cab view with strips and radar", "3D"],
        ["02-radar-scope", "Radar scope", "STARS-style scope, data blocks, agent advisories", "2D"],
        ["03-isometric-control-room", "Isometric control room", "Squawk-style diorama with approval kiosk", "3D"],
        ["04-spawn-tree", "Recursive spawn tree", "Map plus live coordinator → sector → pad tree", "2D"],
        ["05-strips-and-ledger", "Strips + ledger", "Flight strips, reservation Gantt, approvals", "2D"],
        ["06-night-city-3d", "Night city", "Cinematic night Bay with storm and HUD", "3D"],
        ["07-split-race", "Split race", "Static plan vs agent team, same clock", "2D"],
        ["08-learning-lab", "Learning lab", "Policy tweaks on held-out storms, generations curve", "2D"],
        ["09-voice-frequency", "Voice frequency", "Waveform, field-by-field hearback diff, 412/421", "2D"],
        ["10-operator-market", "Operator market", "UDPP slot swaps with private costs", "2D"],
        ["11-photoreal-sfo", "Photoreal SFO", "CesiumJS + Google 3D Tiles, real airliners", "Cesium"],
        ["12-threejs-webgpu", "three.js WebGPU", "PBR, HDR, bloom, rain compute", "WebGPU"],
        ["13-blender-diorama", "Blender diorama", "Blender-built GLB scene animated in three.js", "Blender"],
        ["14-lineup-lanes", "Line-up lanes", "Planes queued nose-to-tail per pad, re-sequenced live", "Queue"],
        ["15-split-3d", "Split 3D", "Static vs agents, two linked 3D dioramas", "Side-by-side"],
        ["16-human-vs-agents", "Human vs agents", "Saturated human frequency vs agent sector split", "Side-by-side"],
        ["17-hearback-on-off", "Hearback off / on", "412/421 slips through vs caught", "Side-by-side"],
        ["19-tower-cab-interior", "Tower cab interior", "Tower! Sim 3-style cab: desk monitors, strips tablet, SFO out the window", "3D"],
        ["20-week-replay", "Week replay", "Aug 24–30: DEV/VAL/TEST, encounters, original vs improved", "Eval"],
        ["18-three-way", "Three-way race", "FCFS vs central optimizer vs agent team", "Side-by-side"],
      ];
      const grid = document.getElementById("grid");
      // Static thumbnails by default; a live iframe only while hovering one card.
      // Running every 3D candidate at once (WebGL + audio prefetch) made this page crawl.
      for (const [file, title, desc, tag] of items) {
        const a = document.createElement("a");
        a.className = "card";
        a.href = file + ".html";
        a.innerHTML = `<div class="frame"><img loading="lazy" src="thumbs/${file}.jpg" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'pending',textContent:'building…'}))"></div><div class="meta"><span class="tag">${tag}</span><b>${file.slice(0, 2)} · ${title}</b><span>${desc}</span></div>`;
        let timer, frame;
        a.addEventListener("mouseenter", () => {
          timer = setTimeout(() => {
            frame = document.createElement("iframe");
            frame.src = file + ".html";
            frame.title = title;
            const box = a.querySelector(".frame");
            frame.style.transform = `scale(${box.clientWidth / 1440})`;
            box.append(frame);
          }, 600);
        });
        a.addEventListener("mouseleave", () => {
          clearTimeout(timer);
          frame?.remove();
          frame = null;
        });
        grid.append(a);
      }
    </script>
  </body>
</html>
