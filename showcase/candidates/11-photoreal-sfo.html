<style>
:root{
  --panel:rgba(10,13,16,.72); --ink:#eef1f3; --mute:#8e989f; --line:rgba(255,255,255,.08);
  --accent:#ffb547; --red:#ff5a4f; --green:#4fdc8a;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace; --sans:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0f13;color:var(--ink);font-family:var(--sans);overflow:hidden}
#cesium{position:absolute;inset:0}
.cesium-viewer-bottom{display:none!important}
#credits{position:absolute;left:0;right:0;bottom:0;height:24px;padding:3px 10px;background:rgba(0,0,0,.45);font-size:10.5px;color:#cfd6db;z-index:20;display:flex;align-items:center;gap:10px;overflow:hidden;white-space:nowrap}
#credits .cesium-credit-textContainer,#credits .cesium-credit-logoContainer{display:inline}
#credits img{height:16px;vertical-align:middle}
#credits a{color:#cfd6db}
.panel{position:absolute;background:var(--panel);border-radius:8px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:10;overflow:hidden}
.ph{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 4px;font:600 10.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.ph b{color:var(--ink);font-weight:600}
/* banner */
#banner{left:50%;transform:translateX(-50%);top:14px;width:min(720px,calc(100% - 800px));min-width:420px;padding:9px 16px 11px}
#banner .meta{display:flex;gap:12px;font:600 10.5px/1.2 var(--mono);color:var(--mute);letter-spacing:.06em;margin-bottom:4px}
#banner .meta #bfreq{color:var(--accent)}
#banner .meta .sp{flex:1}
#bmsg{font:500 17px/1.35 var(--sans)}
#stormflag{display:none;color:var(--red)}
#banner.alert{box-shadow:inset 0 0 0 1px rgba(255,90,79,.55)}
#banner.alert #stormflag{display:inline}
/* merged radio + agent feed */
#feedp{right:14px;top:14px;width:310px;max-height:calc(100% - 140px)}
.feed{padding:4px 10px 10px;display:flex;flex-direction:column;gap:8px}
.it{font:12px/1.38 var(--sans);animation:in .35s ease;padding-left:9px;border-left:2px solid var(--line)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.it .who{font:600 10px/1.3 var(--mono);color:var(--mute);letter-spacing:.04em}
.it .who .tag{margin-left:6px}
.it.plt{margin-left:12px}
.it.live{border-left-color:var(--accent)}
.it.ag{color:#c9d0d5}
.it.ag.rej{border-left-color:var(--red)}
.it.ag.rej .tag{color:var(--red)}
.it.ag.acc .tag{color:var(--green)}
.it .why{font:11px/1.35 var(--mono);color:#ffb3ad;margin-top:2px}
.hb{margin-top:3px;font:600 10px/1.3 var(--mono);color:var(--green)}
.hb .bad{color:var(--red)}
#live{display:none;color:var(--green)}
#recchip{display:none;color:#ff8a80}
#banner .meta span{white-space:nowrap}
body.rec #live,body.rec #simtag{display:none!important}
#bPVC{display:block;width:calc(100% - 20px);margin:0 10px 10px;padding:9px;background:rgba(79,220,138,.16);color:var(--green)}
#bPVC:disabled{opacity:.45;cursor:default}
.live-sep{font:600 9.5px/1 var(--mono);color:var(--green);letter-spacing:.1em;margin-top:2px}
#txlive{font-style:normal;color:var(--red);margin-left:6px;letter-spacing:.08em}
/* scoreboard: four numbers */
#score{left:14px;top:14px;display:flex;padding:10px 6px}
#score .c{padding:0 9px;width:88px}
#score .v{font:600 26px/1 var(--mono)}
#score .v small{font-size:13px;color:var(--mute);font-weight:500}
#score .v.good{color:var(--green)}
#score .v.dim{color:var(--mute)}
#score .k{font:600 9.5px/1.3 var(--sans);color:var(--mute);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
/* camera bar */
#cambar{position:absolute;z-index:10;left:14px;bottom:36px;display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(14,18,22,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 4px 18px rgba(0,0,0,.25)}
#cambar .ib{position:relative;width:34px;height:34px;padding:0;border-radius:50%;display:grid;place-items:center;background:transparent;color:#d9dee2}
#cambar .ib:hover{background:rgba(255,255,255,.12)}
#cambar .ib.on{background:var(--accent);color:#1b1408}
#cambar .ib[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:42px;left:50%;transform:translateX(-50%);white-space:nowrap;font:500 11px/1 var(--sans);color:#fff;background:rgba(14,18,22,.9);padding:5px 8px;border-radius:6px;pointer-events:none}
#speedbar{position:absolute;z-index:10;left:254px;bottom:36px;display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(14,18,22,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 4px 18px rgba(0,0,0,.25)}
#speedbar button{height:34px;min-width:40px;padding:0 9px;border-radius:999px;background:transparent;color:#d9dee2;font:600 12px/1 var(--mono)}
#speedbar button:hover{background:rgba(255,255,255,.12)}
#speedbar button.on{background:var(--accent);color:#1b1408}
#more{display:none;position:absolute;left:150px;bottom:44px;min-width:180px;padding:6px;border-radius:12px;background:rgba(255,255,255,.97);box-shadow:0 10px 30px rgba(0,0,0,.3)}
#more.open{display:block}
#more button{display:flex;justify-content:space-between;width:100%;background:none;color:#1d2733;font:500 12.5px/1 var(--sans);padding:8px 10px;border-radius:7px;text-align:left}
#more button:hover{background:#eef1f4}
#more button.on{background:#e9efff;color:#2b5cff}
#more kbd{font:500 10.5px/1 var(--mono);color:#8a949c}
#more hr{border:0;border-top:1px solid #e6e9ec;margin:4px 2px}
button{font:600 11px/1 var(--sans);color:var(--ink);background:rgba(255,255,255,.06);border:0;border-radius:5px;padding:7px 9px;cursor:pointer}
button:hover{background:rgba(255,255,255,.14)}
button.on{background:var(--accent);color:#1b1408}
.lb{position:absolute;left:0;right:0;height:9vh;background:#000;z-index:4;transform:scaleY(0);transition:transform .6s ease;pointer-events:none}
.lb.top{top:0;transform-origin:top}.lb.bot{bottom:0;transform-origin:bottom}
body.letterbox .lb{transform:scaleY(1)}
/* keep the shared module's one-time sound gate clear of the camera bar */
#skyradio-gate{display:none!important} /* the Sound button enables audio */
/* details layer (key D): strips + radar */
.details{display:none}
body.details .details{display:block}
#strips{left:14px;top:96px;width:300px;max-height:calc(100% - 470px)}
#striplist{padding:4px 6px 6px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.strip{display:grid;grid-template-columns:5px 74px 1fr 50px;align-items:center;background:#e9e3cf;color:#1b1d1f;border-radius:2px;font:600 11px/1.15 var(--mono);min-height:32px}
.strip .bar{height:100%}
.strip.dep .bar{background:#3a8ee6}.strip.arr .bar{background:#e6a23a}.strip.evt .bar{background:#2fb37a}
.strip.reroute{background:#f3d9a8}
.strip .cs{padding:3px 6px;border-right:1px dashed #9b9682}
.strip .cs i,.strip .rt i{display:block;font-style:normal;font-weight:400;font-size:9.5px;color:#55534a}
.strip .rt{padding:3px 6px;font-weight:500;font-size:10.5px;border-right:1px dashed #9b9682;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .st{padding:3px 4px;font-size:9.5px;text-align:center}
.sect{font:600 9.5px/1 var(--sans);letter-spacing:.14em;color:var(--mute);padding:5px 2px 1px;text-transform:uppercase}
#radar{left:14px;bottom:84px;width:300px;height:250px}
#radar canvas{display:block}
#err{display:none;position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);z-index:30;padding:14px 18px;max-width:420px;font:13px/1.4 var(--sans)}
#loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;font:600 11px/1 var(--mono);color:var(--mute);letter-spacing:.14em}
/* flight card + data block (Squawk-style light cards) */
#fcard{display:none;position:absolute;left:14px;bottom:84px;width:410px;z-index:12;background:rgba(255,255,255,.96);color:#1d2733;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.28);padding:14px 16px 12px;font:13px/1.35 var(--sans)}
#fcard .top{display:flex;align-items:baseline;gap:10px}
#fcCs{font:700 18px/1 var(--sans);letter-spacing:.01em}
#fcType{color:#66727d;font-size:12px}
#fcClose{margin-left:auto;background:none;color:#8a949c;padding:2px 4px;font-size:15px}
#fcClose:hover{background:#eef1f4}
#fcRoute{color:#4a5560;font-size:12px;margin-top:3px}
#fcStatus{display:inline-block;margin-top:8px;font:600 11px/1 var(--sans);color:#2b5cff;background:#e9efff;border-radius:999px;padding:5px 9px}
#fcStatus.emg{color:#c62828;background:#fdeaea}
#fcGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 10px}
#fcGrid i{display:block;font-style:normal;font-size:10px;color:#8a949c;text-transform:uppercase;letter-spacing:.06em}
#fcGrid b{font:600 15px/1.2 var(--mono)}
#fcClr{background:#f4f6f8;border-radius:8px;padding:8px 10px;font-size:12px}
#fcClr .q{color:#2d3843}
#fcClr .ok{color:#1e8e4e;font:600 11px/1.4 var(--mono);margin-top:3px}
#fcClr .bad{color:#c62828;font:600 11px/1.4 var(--mono);margin-top:3px}
#fcSteps{display:flex;list-style:none;margin:12px 0 0;padding:0}
#fcSteps li{flex:1;position:relative;text-align:center;font-size:10.5px;color:#9aa3aa;padding-top:16px}
#fcSteps li span{position:absolute;top:0;left:50%;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:#d6dbe0;z-index:1}
#fcSteps li:not(:first-child)::before{content:"";position:absolute;top:5px;left:-50%;width:100%;height:2px;background:#d6dbe0}
#fcSteps li.done span,#fcSteps li.done::before,#fcSteps li.cur::before{background:#2b5cff}
#fcSteps li.done{color:#4a5560}
#fcSteps li.cur{color:#1d2733;font-weight:700}
#fcSteps li.cur span{background:#fff;box-shadow:0 0 0 3px #2b5cff}
#fcTag{display:none;position:absolute;left:0;top:0;z-index:11;pointer-events:none;background:rgba(18,24,30,.86);color:#fff;font:600 11px/1.3 var(--mono);padding:4px 7px;border-radius:5px;white-space:nowrap}
</style>

<!-- Local Cesium via /vendor (raw, compressed, cached): no CDN on venue wifi. -->
<script src="/vendor/cesium/Cesium.js"></script>
<script>if(new URLSearchParams(location.search).get("mode")==="connected"){addEventListener("error",()=>parent.postMessage({type:"uita:renderer-error"},location.origin));addEventListener("unhandledrejection",()=>parent.postMessage({type:"uita:renderer-error"},location.origin));}</script>
<script type="module">
const Cesium = window.Cesium;
(async () => {
const C = Cesium;
const CONNECTED = new URLSearchParams(location.search).get('mode') === 'connected';
const RECORDED = new URLSearchParams(location.search).get('mode') === 'recorded'; // simulation is the default
let details = false; // declared early: labels built before the recorded-mode return read it
const LOOP = 90;                 // seconds per scripted loop
const SIMRATE = 0.85;            // sim minutes per scripted-clock second (eVTOL timeline)
// One global speed. 1x = recorded ADS-B in real time. The scripted scenario (eVTOLs, radio,
// agents, storm) is tuned to play as designed at 10x, so its clock runs at speed / 10.
const SPEEDS = [1, 5, 10, 20, 60];
let speed = (() => { const v = +new URLSearchParams(location.search).get('speed'); return SPEEDS.includes(v) ? v : 10; })();
const GEOID = -32.2;             // EGM96 undulation at SFO (m): ellipsoid = MSL + GEOID
// Offline pack: imagery on the bare ellipsoid, so ground = 0 and MSL heights are used as-is.
// Photoreal (G): ellipsoidal heights, ground refined by sampling the tiles.
let GROUND = 0, VOFF = 0;
const D2R = Math.PI / 180;

// ---------- viewer ----------
const viewer = new C.Viewer('cesium', {
  globe: new C.Globe(C.Ellipsoid.WGS84), baseLayer: false, baseLayerPicker: false, geocoder: false, homeButton: false, sceneModePicker: false,
  navigationHelpButton: false, animation: false, timeline: false, fullscreenButton: false,
  infoBox: false, selectionIndicator: false, creditContainer: document.getElementById('credits'),
  skyAtmosphere: new C.SkyAtmosphere(), msaaSamples: 1, shadows: false, targetFrameRate: 30,
});
const scene = viewer.scene;
scene.skyAtmosphere.show = true;
scene.globe.baseColor = C.Color.fromCssColorString('#1b3a4c');
scene.globe.showGroundAtmosphere = false;
scene.globe.depthTestAgainstTerrain = false;
scene.fog.enabled = false;
scene.postProcessStages.fxaa.enabled = false;
viewer.useBrowserRecommendedResolution = false; // crisp labels on retina
viewer.resolutionScale = Math.min(devicePixelRatio, 2) / devicePixelRatio;
viewer.targetFrameRate = 30;
// Open over SFO so the first tile requests are the ones the establishing shot shows.
let extPaused = false, wasAnim = true;
const SFO_C = C.Cartesian3.fromDegrees(-122.378, 37.617, 0);
let picked = null; // selected aircraft (flight card)
const LBL_FONT = '600 12px Inter,-apple-system,"SF Pro Text","Helvetica Neue",sans-serif';
// clean callsign label: filled text on a dark box, shown near the camera (15 km) or when selected
function callsignLabel(text, extra = {}) {
  return Object.assign({ text, font: LBL_FONT, fillColor: C.Color.WHITE, style: C.LabelStyle.FILL, showBackground: true,
    backgroundColor: C.Color.fromCssColorString('rgba(12,16,20,0.78)'), backgroundPadding: new C.Cartesian2(6, 3),
    pixelOffset: new C.Cartesian2(0, -28), disableDepthTestDistance: Number.POSITIVE_INFINITY }, extra);
}
function nearOrPicked(ent, posFn) {
  return new C.CallbackProperty(time => { if (picked && picked.entity === ent()) return true; const p = posFn(time); return !!p && C.Cartesian3.distance(p, viewer.camera.positionWC) < 15000; }, false);
}
{ const p = orbitPose(SFO_C, 300, -30, 4200); scene.camera.setView({ destination: p.eye, orientation: { heading: p.hdg * D2R, pitch: p.pitch * D2R, roll: 0 } }); }
scene.backgroundColor = C.Color.fromCssColorString('#9fb8cc');
if (!RECORDED) viewer.creditDisplay.addStaticCredit(new C.Credit('Aircraft models: “Airplane” by Poly by Google (CC BY 3.0) · “Boeing 747” by Miha Lunar (CC BY 3.0) · ADS-B: The OpenSky Network · Imagery: USGS NAIP · Buildings and map data © OpenStreetMap contributors · <b>Simulation</b>', true));

// ---------- base map: Google photoreal when online, offline SFO pack as fallback ----------

      for (const poly of polys) { rx.beginPath(); for (const ring of poly) ring.forEach((c, i) => { const [x, y] = proj(c[0], c[1]); i ? rx.lineTo(x, y) : rx.moveTo(x, y); }); rx.fill('evenodd'); rx.stroke(); }

UitaLive.on('step', ({ step, phase }) => { if (phase === 'start') pushLive(`<div class="it ag"><div class="who">KERNEL · ${step.toUpperCase()}</div>running…</div>`); });
$('bPVC').onclick = async () => {
  $('bPVC').disabled = true;
  const r = await UitaLive.proposeVerifyCommit();
  for (const k of ['propose', 'verify', 'commit']) {

UitaLive.start({ intervalMs: 1000 });

// ---------- click an aircraft: data block + flight card (Squawk pattern) ----------
const PICK = new Map(); // entity -> {kind, ref}
for (const a of airliners) PICK.set(a.entity, { kind: 'air', ref: a });
REC.pick = r => PICK.set(r.entity, { kind: 'rec', ref: r });
for (const r of REC.ents.values()) REC.pick(r);
for (const f of flights) PICK.set(f.entity, { kind: 'evtol', ref: f });
let cineEndedAt = -1e9;
const DIG = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];
const SPOKEN = { UAL852: 'United eight five two', SWA1255: 'Southwest twelve fifty-five', ASA331: 'Alaska three thirty-one' };
const spokenOf = cs => SPOKEN[cs] || (cs.startsWith('UTA') ? 'UITA ' + [...cs.slice(3)].map(d => DIG[d]).join(' ') : cs);
const fmt = n => Math.round(n).toLocaleString('en-US');
// latest revealed controller call to this aircraft and the readback that followed it
function clearanceOf(cs) {
  const sp = spokenOf(cs);
  for (let i = revealed - 1; i >= 0; i--) {
    const r = RADIO[i];
    if (r.plt || !r.txt.startsWith(sp)) continue;
    const rb = RADIO.slice(i + 1, revealed).find(x => x.plt && x.who === cs);
    const bad = rb && rb.hb && rb.hb.find(h => h[1]);
    return { txt: r.txt, check: !rb ? 'awaiting readback' : bad ? `✗ readback mismatch · ${bad[0]}` : '✓ readback matched' + (rb.commit ? ' · committed' : ''), bad: !!bad };
  }

}
const STEPS = { arr: ['Descend', 'Hold', 'Approach', 'Land', 'Vacate'], dep: ['Pushback', 'Taxi', 'Takeoff', 'Climb', 'Handoff'], evtol: ['Request', 'Hold', 'Cleared', 'Airborne', 'Land'] };
function describe(p) {
  const t = tNow(), now = clock.currentTime;
  if (p.kind === 'rec') {
    const st = p.ref.st || {}, nearSfo = Math.hypot(((st.lon ?? 0) - SFO_LL[0]) * mPerLon, ((st.lat ?? 0) - SFO_LL[1]) * mPerLat) < 15000;
    let steps = STEPS.arr, step = 0;
    if (st.gnd) { if ((st.gs || 0) < 40) { steps = STEPS.dep; step = 1; } else if (st.vs < 0) step = 3; else { steps = STEPS.dep; step = 2; } }

      alt: st.gnd ? 0 : st.alt, spd: st.gs, hdg: st.trk, cell4: ['On ground', st.gnd ? 'Yes' : 'No'], steps, step,
      clr: { txt: 'Recorded traffic · no voice data', check: `ADS-B · ${Math.round(st.vs || 0).toLocaleString('en-US')} ft/min`, bad: false } };
  }
  if (p.kind === 'air') {
    const a = p.ref, q = a.prof(t), q2 = a.prof(Math.min(a.show[1], t + 0.5)) || q, g = rwyGeo(a.rwy);
    const v = Math.hypot(q2.s - q.s, (q2.lat || 0) - (q.lat || 0), q2.h - q.h) / 0.5;
    let step;
    if (a.kind === 'arr') step = q.h > 1 ? (q.s < -2500 ? 0 : 2) : (q.lat ? 4 : 3);
    else step = t < 28 ? 1 : q.h < 1 ? 2 : q.h < 400 ? 3 : 4;
    const st = a.kind === 'arr' ? ['Descending', 'Holding', 'On final', 'Landing roll', 'Vacating'][step] : ['Pushback', 'Line up and wait', 'Takeoff roll', 'Climbing', 'Handoff to departure'][step];
    return { cs: a.id, type: a.label.split('· ')[1], op: a.kind === 'arr' ? 'Arrival' : 'Departure', route: `Runway ${a.rwy}`, status: st,
      alt: q.h * 3.281, spd: v * 1.944, hdg: (Math.atan2(g.ux, g.uy) / D2R + 360) % 360, delay: 0, steps: STEPS[a.kind], step, clr: clearanceOf(a.id) };
  }
  if (p.kind === 'evtol') {
    const f = p.ref, m = simMin(), prog = Math.max(0, Math.min(1, (m - f.dep) / f.dur));
    const step = m < f.dep - 2 ? 0 : m < f.dep - 0.8 ? 1 : m < f.dep ? 2 : m < f.dep + f.dur - 0.8 ? 3 : 4;
    const a1 = routePoint(f, m), a2 = routePoint(f, m + 0.05);
    return { cs: f.callsign, type: 'eVTOL', op: f.rerouted ? 'Rerouted (storm)' : 'Scheduled', route: `${f.o} → ${f.d} · ${f.route.join('›')}`, status: ['Requesting', 'Holding on pad', 'Cleared', 'Airborne', 'Landing'][step],
      alt: step === 3 ? 1500 : step === 4 ? 1500 * (1 - (m - (f.dep + f.dur - 0.8)) / 0.8) : 0, spd: step === 3 ? KMPM * 1000 / 60 * 1.944 : 0,
      hdg: (Math.atan2((a2[0] - a1[0]) * mPerLon, (a2[1] - a1[1]) * mPerLat) / D2R + 360) % 360, delay: 0, battery: Math.round(96 - 38 * prog),

  const a = p.ref.a, arr = a.op !== 'departure', ps = livePose(a);
  const s = String(a.status || '').toLowerCase();
  let step = arr ? (/hold/.test(s) ? 1 : /approach|final/.test(s) ? 2 : /land|roll/.test(s) ? 3 : /taxi|complete|gate/.test(s) ? 4 : 0)
                 : (/gate|pending|push/.test(s) ? 0 : /taxi/.test(s) ? 1 : /takeoff|roll/.test(s) ? 2 : /complete|handoff/.test(s) ? 4 : 3);

    alt: ps.alt, spd: a.speedKt, hdg: ps.hdg, delay: (a.delayS || 0) / 60, steps: STEPS[arr ? 'arr' : 'dep'], step, emergency: a.emergency,
    clr: { txt: `Backend plan · ${a.path && a.path.length ? a.path.length + ' trajectory points' : 'no trajectory'}`, check: 'kernel-verified plan (no voice readback)', bad: false } };
}
function renderCard() {
  if (!picked) return;

    : picked.kind === 'live' || picked.kind === 'rec' ? !picked.entity.show : !picked.entity.isAvailable(clock.currentTime) || !picked.entity.show;
  if (gone) return closeCard();

  $('fcCs').textContent = d.cs; $('fcType').textContent = `${d.type} · ${d.op}`; $('fcRoute').textContent = d.route;
  $('fcStatus').textContent = d.status; $('fcStatus').classList.toggle('emg', !!d.emergency);
  const cells = [['Altitude', `${fmt(d.alt)} ft`], ['Speed', `${fmt(d.spd || 0)} kt`], ['Heading', `${String(Math.round(d.hdg || 0) % 360).padStart(3, '0')}°`],
    d.cell4 || (d.battery != null ? ['Battery', `${d.battery}%`] : ['Delay', `${(d.delay || 0).toFixed(1)} min`])];

  $('fcClr').innerHTML = d.clr ? `<div class="q">${esc(d.clr.txt)}</div><div class="${d.clr.bad ? 'bad' : 'ok'}">${esc(d.clr.check)}</div>` : '<div class="q">No clearance issued yet</div>';

function selectAircraft(e, chase) {

viewer.entities.add({
  position: new C.CallbackProperty(() => picked && picked.entity.position.getValue(clock.currentTime), false),
  point: { pixelSize: 38, color: C.Color.TRANSPARENT, outlineColor: C.Color.fromCssColorString('#4c7dff'), outlineWidth: 2.5, disableDepthTestDistance: Number.POSITIVE_INFINITY,
    show: new C.CallbackProperty(() => !!picked, false) },

  const hit = scene.pick(click.position);
  let e = hit && hit.id;
  if (!(e && PICK.has(e))) { // forgiving pick: nearest aircraft within 28 px (recorded traffic moves at 20x)
    let best = 28 * 28; e = null;
    for (const ent of PICK.keys()) {
      if (ent.show === false || (ent.availability && !ent.isAvailable(clock.currentTime))) continue;
      const p = ent.position && ent.position.getValue(clock.currentTime), w = p && w2w(scene, p);
      if (!w) continue;
      const d = (w.x - click.position.x) ** 2 + (w.y - click.position.y) ** 2;
      if (d < best) { best = d; e = ent; }
    }
  }
  if (e && PICK.has(e)) selectAircraft(e, performance.now() - cineEndedAt < 1500);
  else closeCard();
}, C.ScreenSpaceEventType.LEFT_CLICK);
viewer.screenSpaceEventHandler.removeInputAction(C.ScreenSpaceEventType.LEFT_DOUBLE_CLICK);
// keep the data block glued to the aircraft
const w2w = C.SceneTransforms.worldToWindowCoordinates || C.SceneTransforms.wgs84ToWindowCoordinates;
scene.postRender.addEventListener(() => {
  if (!picked) return;
  const pos = picked.entity.position.getValue(clock.currentTime), el = $('fcTag');
  const w = pos && w2w(scene, pos);
  if (!w) { el.style.visibility = 'hidden'; return; }

$('fcClose').onclick = closeCard;
// ---------- main tick ----------
let lastT = 0, lastHud = -1;
scene.preRender.addEventListener(() => {
  const t = tNow(); const dt = Math.max(0, Math.min(0.2, t - lastT)); lastT = t;
  setCam(t, dt || 0.016);
  if (details) drawRadar(t);
  radioStep(t);

window.__sky = { rec: REC, setSpeed, speed: () => speed, viewer, airliners, select: (e, chase) => selectAircraft(e, chase), picked: () => picked && describe(picked), w2w: p => w2w(scene, p), setPhotoreal, buildings: () => buildings, yawFix, preset, resumeCine, pauseCine, zoom, setPaused, mode: () => camMode, seek: s => clock.currentTime = at(s) };
})();
