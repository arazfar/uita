<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preload" as="script" href="/vendor/cesium/Cesium.js" />
<title>UITA Tower SFO</title>
<script>window.CESIUM_BASE_URL = '/vendor/cesium/';</script>
<link rel="stylesheet" href="/vendor/cesium/Widgets/widgets.css">
<script src="radio-audio.js?v=3"></script>
<script src="uita-live.js"></script>
<style>
:root{
  --panel:rgba(10,13,16,.72); --ink:#eef1f3; --mute:#8e989f; --line:rgba(255,255,255,.08);
  --accent:#ffb547; --red:#ff5a4f; --green:#4fdc8a;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace; --sans:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0f13;color:var(--ink);font-family:var(--sans);overflow:hidden}
#cesium{position:absolute;inset:0}
.cesium-viewer-bottom{display:none!important}
#credits{position:absolute;left:0;right:0;bottom:0;height:24px;padding:3px 10px;background:rgba(0,0,0,.45);font-size:10.5px;color:#cfd6db;z-index:20;display:flex;align-items:center;gap:10px;overflow:hidden;white-space:nowrap}
#credits .cesium-credit-textContainer,#credits .cesium-credit-logoContainer{display:inline}
#credits img{height:16px;vertical-align:middle}
#credits a{color:#cfd6db}
.panel{position:absolute;background:var(--panel);border-radius:8px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:10;overflow:hidden}
.ph{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 4px;font:600 10.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.ph b{color:var(--ink);font-weight:600}
/* banner */
#banner{left:50%;transform:translateX(-50%);top:14px;width:min(720px,calc(100% - 800px));min-width:420px;padding:9px 16px 11px}
#banner .meta{display:flex;gap:12px;font:600 10.5px/1.2 var(--mono);color:var(--mute);letter-spacing:.06em;margin-bottom:4px}
#banner .meta #bfreq{color:var(--accent)}
#banner .meta .sp{flex:1}
#bmsg{font:500 17px/1.35 var(--sans)}
#stormflag{display:none;color:var(--red)}
#banner.alert{box-shadow:inset 0 0 0 1px rgba(255,90,79,.55)}
#banner.alert #stormflag{display:inline}
/* merged radio + agent feed */
#feedp{right:14px;top:14px;width:340px;max-height:calc(100% - 140px)}
.feed{padding:4px 10px 10px;display:flex;flex-direction:column;gap:8px}
.it{font:13px/1.4 var(--sans);animation:in .35s ease;padding-left:9px;border-left:2px solid var(--line)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.it .who{font:600 10px/1.3 var(--mono);color:var(--mute);letter-spacing:.04em}
.it .who .tag{margin-left:6px}
.it.plt{margin-left:12px}
.it.live{border-left-color:var(--accent)}
.it.ag{color:#c9d0d5}
.it.ag.rej{border-left-color:var(--red)}
.it.ag.rej .tag{color:var(--red)}
.it.ag.acc .tag{color:var(--green)}
.it .why{font:11px/1.35 var(--mono);color:#ffb3ad;margin-top:2px}
.hb{margin-top:3px;font:600 10px/1.3 var(--mono);color:var(--green)}
.hb .bad{color:var(--red)}
#live{display:none;color:var(--green)}
#bPVC{display:block;width:calc(100% - 20px);margin:0 10px 10px;padding:9px;background:rgba(79,220,138,.16);color:var(--green)}
#bPVC:disabled{opacity:.45;cursor:default}
.live-sep{font:600 9.5px/1 var(--mono);color:var(--green);letter-spacing:.1em;margin-top:2px}
#txlive{font-style:normal;color:var(--red);margin-left:6px;letter-spacing:.08em}
/* scoreboard: four numbers */
#score{left:14px;top:14px;display:flex;padding:10px 6px}
#score .c{padding:0 9px;width:88px}
#score .v{font:600 30px/1 var(--mono)}
#score .v small{font-size:13px;color:var(--mute);font-weight:500}
#score .v.good{color:var(--green)}
#score .v.dim{color:var(--mute)}
#score .k{font:600 9.5px/1.3 var(--sans);color:var(--mute);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
/* camera bar */
#cambar{left:50%;transform:translateX(-50%);bottom:36px;width:max-content;display:flex;gap:4px;padding:5px;align-items:center;white-space:nowrap}
#cambar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
#cambar #bZout,#cambar #bZin{width:28px;font-size:14px;padding:4px 0}
#camlabel{font:600 10px/1 var(--mono);color:var(--mute);letter-spacing:.06em;padding:0 6px}
button{font:600 11px/1 var(--sans);color:var(--ink);background:rgba(255,255,255,.06);border:0;border-radius:5px;padding:7px 9px;cursor:pointer}
button:hover{background:rgba(255,255,255,.14)}
button.on{background:var(--accent);color:#1b1408}
#resume{display:none;background:var(--accent);color:#1b1408}
.lb{position:absolute;left:0;right:0;height:9vh;background:#000;z-index:4;transform:scaleY(0);transition:transform .6s ease;pointer-events:none}
.lb.top{top:0;transform-origin:top}.lb.bot{bottom:0;transform-origin:bottom}
body.letterbox .lb{transform:scaleY(1)}
/* keep the shared module's one-time sound gate clear of the camera bar */
#skyradio-gate{top:108px!important;bottom:auto!important;font-size:12px!important;padding:8px 14px!important}
/* details layer (key D): strips + radar */
.details{display:none}
body.details .details{display:block}
#strips{left:14px;top:96px;width:300px;max-height:calc(100% - 470px)}
#striplist{padding:4px 6px 6px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.strip{display:grid;grid-template-columns:5px 74px 1fr 50px;align-items:center;background:#e9e3cf;color:#1b1d1f;border-radius:2px;font:600 11px/1.15 var(--mono);min-height:32px}
.strip .bar{height:100%}
.strip.dep .bar{background:#3a8ee6}.strip.arr .bar{background:#e6a23a}.strip.evt .bar{background:#2fb37a}
.strip.reroute{background:#f3d9a8}
.strip .cs{padding:3px 6px;border-right:1px dashed #9b9682}
.strip .cs i,.strip .rt i{display:block;font-style:normal;font-weight:400;font-size:9.5px;color:#55534a}
.strip .rt{padding:3px 6px;font-weight:500;font-size:10.5px;border-right:1px dashed #9b9682;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .st{padding:3px 4px;font-size:9.5px;text-align:center}
.sect{font:600 9.5px/1 var(--sans);letter-spacing:.14em;color:var(--mute);padding:5px 2px 1px;text-transform:uppercase}
#radar{left:14px;bottom:36px;width:300px;height:250px}
#radar canvas{display:block}
#err{display:none;position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);z-index:30;padding:14px 18px;max-width:420px;font:13px/1.4 var(--sans)}
#loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;font:600 11px/1 var(--mono);color:var(--mute);letter-spacing:.14em}
</style>
</head>
<body>
<div id="cesium"></div>
<div id="loading">LOADING SFO MAP PACK…</div>

<div id="banner" class="panel"><div class="meta"><span id="bfreq">SFO TWR 120.500</span><span id="clk">T+00:00</span><span id="stormflag">C–E CLOSED</span><span class="sp"></span><span id="simtag">UITA · SIMULATION</span><span id="live">● LIVE · UITA server</span></div><div id="bmsg">Standing by.</div></div>

<div id="feedp" class="panel"><div class="ph"><span>Radio · agents <i id="txlive"></i></span><b id="feedcount"></b></div><div class="feed" id="feed"></div><button id="bPVC" disabled title="Live UITA server required">Agents propose → Kernel verify → Commit</button></div>

<div id="score" class="panel">
  <div class="c"><div class="v good"><span id="sAgent">0</span><small id="sAgentDen">/28</small></div><div class="k" id="k1">On time · agents</div></div>
  <div class="c"><div class="v dim"><span id="sStatic">0</span><small id="sStaticDen">/28</small></div><div class="k" id="k2">Static plan</div></div>
  <div class="c"><div class="v" id="sConf">0</div><div class="k">Conflicts</div></div>
  <div class="c"><div class="v" id="sHuman">0</div><div class="k">Human interv.</div></div>
</div>

<div class="details">
<div id="strips" class="panel"><div class="ph"><span>Flight strips</span><b id="stripcount">0 active</b></div><div id="striplist"></div></div>
<div id="radar" class="panel"><div class="ph"><span>Approach radar</span><b>20 NM</b></div><canvas id="rc" width="300" height="224"></canvas></div>
</div>

<div id="cambar" class="panel">
  <button id="bPlay" title="Space">Pause</button><button id="bRestart">Restart</button>
  <span class="sep"></span>
  <button data-preset="1" title="Key 1">1 Overview</button><button data-preset="2" title="Key 2">2 Tower</button><button data-preset="3" title="Key 3: chase the selected flight (click one to select)">3 Chase</button><button data-preset="4" title="Key 4">4 Storm</button><button data-preset="5" title="Key 5">5 OAK pad</button>
  <span class="sep"></span><button id="bZout" title="Zoom out (−)" aria-label="Zoom out">−</button><button id="bZin" title="Zoom in (+)" aria-label="Zoom in">+</button>
  <span class="sep"></span><button id="bCine" class="on" title="Key C">Cinematic</button><button id="resume">Resume cinematic</button><button id="bSnd" title="Radio voice on/off">Sound off</button><button id="bDet" title="Key D: strips, radar, labels">Details</button><button id="bBox" title="Key L">Letterbox</button><button id="bPhoto" title="Key G: stream Google Photorealistic 3D Tiles (needs network)">Photoreal (online)</button>
  <span id="camlabel">CINEMATIC</span>
</div>
<div class="lb top"></div><div class="lb bot"></div>
<div id="err" class="panel"></div>
<div id="credits"></div>

<!-- Local Cesium via /vendor (raw, compressed, cached): no CDN on venue wifi. -->
<script src="/vendor/cesium/Cesium.js"></script>
<script type="module">
const Cesium = window.Cesium;
(async () => {
const C = Cesium;
const LOOP = 90;                 // seconds per scripted loop
const SIMRATE = 0.85;            // sim minutes per wall second (eVTOL timeline)
const GEOID = -32.2;             // EGM96 undulation at SFO (m): ellipsoid = MSL + GEOID
// Offline pack: imagery on the bare ellipsoid, so ground = 0 and MSL heights are used as-is.
// Photoreal (G): ellipsoidal heights, ground refined by sampling the tiles.
let GROUND = 0, VOFF = 0;
const D2R = Math.PI / 180;

// ---------- viewer ----------
const viewer = new C.Viewer('cesium', {
  globe: new C.Globe(C.Ellipsoid.WGS84), baseLayer: false, baseLayerPicker: false, geocoder: false, homeButton: false, sceneModePicker: false,
  navigationHelpButton: false, animation: false, timeline: false, fullscreenButton: false,
  infoBox: false, selectionIndicator: false, creditContainer: document.getElementById('credits'),
  skyAtmosphere: new C.SkyAtmosphere(), msaaSamples: 1, shadows: false, targetFrameRate: 30,
});
const scene = viewer.scene;
scene.skyAtmosphere.show = true;
scene.globe.baseColor = C.Color.fromCssColorString('#1b3a4c');
scene.globe.showGroundAtmosphere = false;
scene.globe.depthTestAgainstTerrain = false;
scene.fog.enabled = false;
scene.postProcessStages.fxaa.enabled = false;
viewer.resolutionScale = Math.min(devicePixelRatio, 1.25) / devicePixelRatio;
viewer.targetFrameRate = 30;
// Open over SFO so the first tile requests are the ones the establishing shot shows.
let extPaused = false, wasAnim = true;
const SFO_C = C.Cartesian3.fromDegrees(-122.375, 37.64, 0);
{ const p = orbitPose(SFO_C, 300, -34, 16000); scene.camera.setView({ destination: p.eye, orientation: { heading: p.hdg * D2R, pitch: p.pitch * D2R, roll: 0 } }); }
scene.backgroundColor = C.Color.fromCssColorString('#9fb8cc');
viewer.creditDisplay.addStaticCredit(new C.Credit('Aircraft models: “Airplane” by Poly by Google (CC BY 3.0) · “Boeing 747” by Miha Lunar (CC BY 3.0) · ADS-B: The OpenSky Network · Imagery: USGS NAIP · Buildings and map data © OpenStreetMap contributors · <b>Simulation</b>', true));

// ---------- base map: offline SFO pack (default) · Google photoreal opt-in (G) ----------
const PACK = 'sfo-pack/';
const hideLoading = () => { document.getElementById('loading').style.display = 'none'; };
let buildings = null, tileset = null, photoreal = false;
try {
  const pb = await (await fetch(PACK + 'bounds.json')).json();
  // bay overview under the 1.2 m SFO detail (Mercator rows vs linear latitude: <0.3 m at SFO, ~25 m mid-bay)
  for (const k of ['bay', 'sfo']) {
    const im = pb.images[k], b = im.lonlat_bounds;
    viewer.imageryLayers.add(C.ImageryLayer.fromProviderAsync(C.SingleTileImageryProvider.fromUrl(PACK + im.file, { rectangle: C.Rectangle.fromDegrees(b.west, b.south, b.east, b.north) })));
  }
  const o = pb.enu.origin_lonlat; // GLB is ENU metres from the SFO tower, glTF y-up / z = -north
  C.Model.fromGltfAsync({ url: PACK + 'sfo-buildings.glb', modelMatrix: C.Transforms.eastNorthUpToFixedFrame(C.Cartesian3.fromDegrees(o[0], o[1], 0)), upAxis: C.Axis.Y, forwardAxis: C.Axis.X })
    .then(m => { buildings = m; m.show = !photoreal; scene.primitives.add(m); m.readyEvent.addEventListener(hideLoading); })
    .catch(e => console.warn('buildings GLB failed', e));
} catch (e) { console.warn('SFO pack failed', e); }
setTimeout(hideLoading, 3000);

async function setPhotoreal(on) {
  const err = document.getElementById('err');
  if (on && !tileset) {
    try {
      const key = (await (await fetch('/api/maps-key')).json()).key;
      C.GoogleMaps.defaultApiKey = key;
      const opts = { maximumScreenSpaceError: 24, skipLevelOfDetail: true, preloadFlightDestinations: true, foveatedScreenSpaceError: true, dynamicScreenSpaceError: true, cacheBytes: 256 * 1024 * 1024, showCreditsOnScreen: true };
      try { tileset = await C.createGooglePhotorealistic3DTileset({ onlyUsingWithGoogleGeocoder: true }, opts); }
      catch (e) { tileset = await C.Cesium3DTileset.fromUrl(`https://tile.googleapis.com/v1/3dtiles/root.json?key=${key}`, opts); }
      scene.primitives.add(tileset);
    } catch (e) {
      err.style.display = 'block'; err.textContent = 'Photoreal tiles unavailable (no key or no network). Staying on the offline SFO pack.';
      setTimeout(() => { err.style.display = 'none'; }, 4000);
      return;
    }
  }
  photoreal = on;
  if (tileset) tileset.show = on;
  scene.globe.show = !on;
  if (buildings) buildings.show = !on;
  GROUND = on ? 4 + GEOID : 0; VOFF = on ? GEOID : 0;
  for (const a of airliners) a.pos = buildAirliner(a);
  $('bPhoto').classList.toggle('on', on);
  if (on) setTimeout(async () => { // refine ground from the photoreal mesh at the 28R touchdown zone
    try {
      const g = rwyGeo('28R'); const c = C.Cartographic.fromDegrees(g.a[0] + g.ux * 500 / mPerLon, g.a[1] + g.uy * 500 / mPerLat);
      const [r] = await scene.sampleHeightMostDetailed([c]);
      if (photoreal && r && Number.isFinite(r.height) && Math.abs(r.height - GROUND) < 25) { GROUND = r.height; for (const a of airliners) a.pos = buildAirliner(a); }
    } catch (e) { console.warn('height sample failed', e); }
  }, 6000);
}

// ---------- clock ----------
const T0 = C.JulianDate.fromIso8601('2026-10-17T20:30:00Z');
const T1 = C.JulianDate.addSeconds(T0, LOOP, new C.JulianDate());
const clock = viewer.clock;
clock.startTime = T0.clone(); clock.stopTime = T1.clone(); clock.currentTime = T0.clone();
clock.clockRange = C.ClockRange.LOOP_STOP; clock.multiplier = 1; clock.shouldAnimate = true;
const at = s => C.JulianDate.addSeconds(T0, s, new C.JulianDate());
const tNow = () => C.JulianDate.secondsDifference(clock.currentTime, T0);

// ---------- data ----------
const getJSON = async p => { try { const r = await fetch(p); return r.ok ? r.json() : null; } catch (e) { return null; } };
const [airports, adsb, coast] = await Promise.all([getJSON('data/airports.geojson'), getJSON('data/adsb-tracks.json'), getJSON('data/bay-coastline.geojson')]);

// Runway 28R / 28L: [threshold(east end), far end(west)]
const RWY = { '28R': [[-122.358089, 37.613926], [-122.393396, 37.628738]], '28L': [[-122.359265, 37.612091], [-122.393094, 37.626281]] };
if (airports) for (const f of airports.features) {
  const p = f.properties; if (p.kind !== 'runway' || p.airport !== 'SFO') continue;
  const c = f.geometry.coordinates;
  if (c.length > 10 && p.ref === '10L/28R') RWY['28R'] = [c[0], c[c.length - 1]];
  if (c.length > 10 && p.ref === '10R/28L') RWY['28L'] = [c[0], c[c.length - 1]];
}
const mPerLon = 111320 * Math.cos(37.62 * D2R), mPerLat = 110950;
function rwyGeo(r) {
  const [a, b] = RWY[r];
  const dx = (b[0] - a[0]) * mPerLon, dy = (b[1] - a[1]) * mPerLat, L = Math.hypot(dx, dy);
  return { a, ux: dx / L, uy: dy / L, L };
}
// s: metres past threshold (negative = on approach), lat: metres right of centreline, h: metres AGL
function rwyPos(r, s, h, lat = 0) {
  const g = rwyGeo(r);
  const x = g.ux * s + g.uy * lat, y = g.uy * s - g.ux * lat;
  return C.Cartesian3.fromDegrees(g.a[0] + x / mPerLon, g.a[1] + y / mPerLat, GROUND + h);
}

// ---------- airliners (real-time kinematics) ----------
// each profile returns {s, h, lat} for wall time t, or null when not shown
const VREF = 72;
const airliners = [
  { id: 'UAL852', label: 'UAL852 · B744', model: 'assets/boeing747-mihalunar/model.glb', scale: 46, base: 16.8, hdg: 0, rwy: '28R', kind: 'arr', show: [0, 74],
    prof(t) { // short final -> touchdown at t=27 -> rollout -> high speed exit north
      const s0 = -1900;
      if (t < 27) { const s = s0 + VREF * t; return { s, h: Math.max(0, -s * Math.tan(3 * D2R) + 15 * (s < 0 ? 1 : 0)) }; }
      const sT = s0 + VREF * 27, dt = t - 27, dec = 1.6;
      if (dt < 34) return { s: sT + VREF * dt - 0.5 * dec * dt * dt, h: 0 };
      const sR = sT + VREF * 34 - 0.5 * dec * 34 * 34, v = VREF - dec * 34, e = t - 61;
      return { s: sR + v * e, h: 0, lat: -Math.min(220, 0.9 * e * e) };
    } },
  { id: 'SWA1255', label: 'SWA1255 · B737', model: 'assets/airplane-google/model.glb', scale: 0.38, base: 0, hdg: 0, rwy: '28L', kind: 'dep', show: [0, 90],
    prof(t) { // line up and wait, takeoff roll from t=28, rotate ~ 72 m/s, climb out
      if (t < 28) return { s: 120 + 0.4 * t, h: 0 };
      const a = 2.3, dt = t - 28, tr = 32; // rotate after 32 s
      if (dt < tr) return { s: 131 + 0.5 * a * dt * dt, h: 0 };
      const sR = 131 + 0.5 * a * tr * tr, v = a * tr, e = dt - tr;
      return { s: sR + v * e, h: Math.min(900, 0.18 * e * e + 4 * e) };
    } },
  { id: 'ASA331', label: 'ASA331 · A320', model: 'assets/airplane-google/model.glb', scale: 0.4, base: 0, hdg: 0, rwy: '28R', kind: 'arr', show: [30, 90],
    prof(t) { // longer final, touches down ~t=80
      const s0 = -3500, t0 = 30, e = t - t0;
      if (e < 49) { const s = s0 + VREF * e; return { s, h: -s * Math.tan(3 * D2R) + 15 }; }
      const sT = s0 + VREF * 49, d = e - 49;
      return { s: sT + VREF * d - 0.8 * d * d, h: Math.max(0, 15 - d * 6) };
    } },
];
function buildAirliner(a) {
  const pos = new C.SampledPositionProperty();
  pos.forwardExtrapolationType = C.ExtrapolationType.HOLD;
  for (let t = a.show[0]; t <= a.show[1]; t += 0.5) {
    const p = a.prof(t); pos.addSample(at(t), rwyPos(a.rwy, p.s, p.h + a.base, p.lat || 0));
  }
  return pos;
}
const yawFix = {};
for (const a of airliners) {
  a.pos = buildAirliner(a);
  const vel = new C.VelocityOrientationProperty(a.pos);
  let last = null;
  const ori = new C.CallbackProperty((time, result) => {
    const q = vel.getValue(time, result);
    if (!q) return last;
    const fix = C.Quaternion.fromAxisAngle(C.Cartesian3.UNIT_Z, (yawFix[a.model] ?? 0) * D2R);
    last = C.Quaternion.multiply(q, fix, new C.Quaternion());
    return last;
  }, false);
  a.entity = viewer.entities.add({
    id: a.id,
    availability: new C.TimeIntervalCollection([new C.TimeInterval({ start: at(a.show[0]), stop: at(a.show[1]) })]),
    position: new C.CallbackProperty(time => a.pos.getValue(time), false),
    orientation: ori,
    model: { uri: a.model, scale: a.scale, minimumPixelSize: 28, maximumScale: 4000 },
    label: { text: new C.CallbackProperty(() => details ? a.label : a.id, false), font: '600 12px ui-monospace,Menlo,monospace', fillColor: C.Color.WHITE, outlineColor: C.Color.BLACK, outlineWidth: 3,
      style: C.LabelStyle.FILL_AND_OUTLINE, pixelOffset: new C.Cartesian2(0, -30), showBackground: true, backgroundColor: C.Color.fromCssColorString('rgba(10,14,18,.65)'),
      disableDepthTestDistance: Number.POSITIVE_INFINITY, distanceDisplayCondition: new C.DistanceDisplayCondition(0, 25000) },
  });
}
// The 747 glTF models its nose along -Z, the Poly airplane along +Z.
yawFix['assets/boeing747-mihalunar/model.glb'] = 180;
yawFix['assets/airplane-google/model.glb'] = 0;

// ---------- UITA eVTOL network (fleet callsign "SkyFlow") ----------
const NODES = { SF: [-122.41, 37.785], MAR: [-122.485, 37.862], SFO: [-122.375, 37.622], OAK: [-122.235, 37.722], BER: [-122.275, 37.865],
  W: [-122.39, 37.73], C: [-122.34, 37.79], E: [-122.29, 37.77] };
const EDGES = ['SF-MAR', 'SF-W', 'SF-C', 'C-BER', 'C-E', 'W-E', 'W-SFO', 'E-OAK', 'OAK-BER'];
const CORR_MSL = 457; // 1,500 ft
const cAlt = CORR_MSL + GEOID;
const STORM = [8, 24];
const corridorEnt = {};
for (const e of EDGES) {

const ROUTES = {

const KMPM = 2.6; // km per sim minute (~85 kt)
function km(a, b) { return Math.hypot((b[0] - a[0]) * 88.2, (b[1] - a[1]) * 110.9); }

const flights = [];
for (let i = 0; i < 28; i++) {
  const [o, d] = TRIPS[(i * 3) % TRIPS.length];
  const opts = ROUTES[`${o}-${d}`];
  const dep = i * 2.5;
  let route = opts[0];
  const dur0 = routeLen(route) / KMPM;

function routePoint(f, m) {
  let dist = Math.max(0, m - f.dep) * KMPM;

    const a = NODES[f.route[i - 1]], b = NODES[f.route[i]], L = km(a, b);

function drawRadar(t) {

      for (const poly of polys) { rx.beginPath(); for (const ring of poly) ring.forEach((c, i) => { const [x, y] = proj(c[0], c[1]); i ? rx.lineTo(x, y) : rx.moveTo(x, y); }); rx.fill('evenodd'); rx.stroke(); }
    }
  }
