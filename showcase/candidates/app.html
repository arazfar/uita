<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://tile.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UITA Control</title>
    <style>
      :root {
        --ink: #e6edf0;
        --muted: #8aa0a8;
        --bg: #0b1114;
        --pill: #142027cc;
        --line: #2a3b44;
        --on: #2fa3c9;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.4 Inter, ui-sans-serif, system-ui, sans-serif;
        overflow: hidden;
      }
      iframe {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: var(--bg);
      }
      /* display:none stops rAF in Chrome, so the hidden view costs no GPU time. */
      iframe[hidden] {
        display: none;
      }
      .switch {
        position: fixed;
        right: 16px;
        bottom: 34px;
        z-index: 10;
        display: flex;
        gap: 2px;
        padding: 3px;
        border-radius: 999px;
        background: var(--pill);
        border: 1px solid var(--line);
        backdrop-filter: blur(8px);
        box-shadow: 0 8px 28px #0007;
      }
      .switch button {
        border: 0;
        border-radius: 999px;
        padding: 7px 14px;
        font: 600 12px/1 Inter, ui-sans-serif, system-ui, sans-serif;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
        white-space: nowrap;
      }
      .switch button[aria-pressed="true"] {
        background: var(--on);
        color: #fff;
      }
      .switch kbd {
        margin-left: 6px;
        font: 10px ui-monospace, monospace;
        opacity: 0.7;
      }
      .loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--muted);
        pointer-events: none;
        z-index: 5;
      }
    </style>
    <link rel="stylesheet" href="sfo-history.css">
  </head>
  <body>
    <div class="loading" id="loading">Loading SFO…</div>
    <iframe id="dash" title="UITA dashboard" allow="autoplay; microphone"></iframe>
    <iframe id="cab" title="UITA tower cab" hidden allow="autoplay; microphone"></iframe>
    <div class="switch" role="group" aria-label="View">
      <button data-view="dash" aria-pressed="true">Recorded week<kbd>T</kbd></button
      ><button data-view="cab" aria-pressed="false">Tower simulation</button>
    </div>
    <script>
      const frames = { dash: document.getElementById("dash"), cab: document.getElementById("cab") };
      const src = { dash: "11-photoreal-sfo.html", cab: "19-tower-cab-interior.html" };
      // Load the tower simulation only on request, keeping recorded replay isolated.
      let view = location.hash === "#cab" ? "cab" : "dash";
      document.body.dataset.view = view;
      const other = view === "cab" ? "dash" : "cab";
      const clearLoading = () => document.getElementById("loading")?.remove();
      frames[view].hidden = false;
      frames[other].hidden = true;
      frames[view].src = src[view];
      frames[view].addEventListener(
        "load",
        () => {
          clearLoading();
        },
        { once: true },
      );
      setTimeout(clearLoading, 1500);
      document
        .querySelectorAll("[data-view]")
        .forEach((b) => b.setAttribute("aria-pressed", b.dataset.view === view));
      function show(next) {
        if (next === view) return;
        const prev = frames[view];
        prev.contentWindow?.postMessage({ skyflow: "pause" }, "*");
        prev.hidden = true;
        const f = frames[next];
        if (!f.src) f.src = src[next]; // lazy: the cab loads on first toggle
        else f.contentWindow?.postMessage({ skyflow: "resume" }, "*");
        f.hidden = false;
        f.focus();
        view = next;
        document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.view === view));
        document.body.dataset.view = view;
        history.replaceState(null, "", view === "cab" ? "#cab" : location.pathname);
      }
      document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => show(b.dataset.view)));
      const toggle = () => show(view === "dash" ? "cab" : "dash");
      addEventListener("keydown", (e) => e.key.toLowerCase() === "t" && !e.repeat && toggle());
      // Iframes forward their T presses here so the shortcut works wherever focus is.
      addEventListener("message", (e) => e.data?.skyflow === "toggle" && toggle());
    </script>
  </body>
</html>
