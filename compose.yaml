services:
  uita:
    build: .
    ports: ["127.0.0.1:8001:8001"]
    environment:
      DATABASE_URL: postgresql+psycopg://uita:uita@postgres:5432/uita
      UITA_API_TOKEN: ${UITA_API_TOKEN:-}
      UITA_ALLOWED_ORIGINS: http://localhost:8001,http://127.0.0.1:8001
    depends_on:
      postgres:
        condition: service_healthy
    volumes: ["uita-data:/data"]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: uita
      POSTGRES_PASSWORD: uita
      POSTGRES_DB: uita
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uita"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["postgres-data:/var/lib/postgresql/data"]
volumes:
  postgres-data:
  uita-data:
